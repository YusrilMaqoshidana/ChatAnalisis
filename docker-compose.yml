services:
  # Backend Service (FastAPI)
  backend:
    build:
      context: ./ChatAnalisis-BE
    expose:
      - "8000"
    environment:
      - CORS_ORIGINS=["*"]
      - MAX_FILE_SIZE_MB=10
      - ZIP_MAX_EXTRACTED_MB=200
    volumes:
      - backend_data:/app/storage
    restart: unless-stopped

  # Frontend Service (Vue 3 + Vite + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./ChatAnalisis-FE
      args:
        - VITE_API_BASE_URL=/
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  backend_data:
