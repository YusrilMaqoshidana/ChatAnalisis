services:
  # ----------------------------------------------------
  # Backend Service (FastAPI)
  # ----------------------------------------------------
  backend:
    build:
      context: ./ChatAnalisis-BE
    container_name: chatanalisis-backend
    expose:
      - "8000"
    environment:
      - CORS_ORIGINS=["https://chatanalisis.yusrilmaqoshidana.my.id"]
      - MAX_FILE_SIZE_MB=10
      - ZIP_MAX_EXTRACTED_MB=200
    volumes:
      - backend_data:/app/storage
    restart: unless-stopped

  # ----------------------------------------------------
  # Frontend Service (Vue 3 + Vite)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./ChatAnalisis-FE
      args:
        - VITE_API_BASE_URL=/
    container_name: chatanalisis-frontend
    expose:
      - "80"
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  backend_data:
    driver: local
